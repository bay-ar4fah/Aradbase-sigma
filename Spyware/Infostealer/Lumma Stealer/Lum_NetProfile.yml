title: Lumma Stealer Network Behavior - IP Geolocation API Discovery
id: 2c2c3b8e-9012-406a-9f5b-1d7e2f5b8a9c
status: stable
description: Detects DNS queries to IP geolocation services commonly used by Lumma Stealer (and other infostealers) to identify the victim's network before exfiltration.
author: bay-ar4fah
date: 2026/06/02
tags:
    - attack.discovery
    - attack.t1614
logsource:
    category: dns_query
    product: windows
detection:
    selection_dns:
        QueryName:
            - 'ipapi.co'
            - 'ipinfo.io'
            - 'ip-api.com'
    
    filter_browsers:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\brave.exe'
            - '\opera.exe'
            - '\curl.exe'

    condition: selection_dns and not filter_browsers
falsepositives:
    - Beberapa aplikasi legit non-browser (seperti VPN client atau script admin) mungkin melakukan ping ke layanan ini. Identifikasi dan Analisis proses (Image) yang menginisiasi request tersebut.
level: high
