title: R77 Rootkit / SheetRat Dropper Execution
id: 8b7d41f9-3d14-406a-9f5b-1d7e2f5b8a9c
status: experimental
description: Detects the execution of R77 Rootkit and SheetRat/AsyncRAT droppers. It triggers on exact hash matches, known campaign filenames, or masqueraded svchost.exe executing outside of legitimate Windows system directories.
author: bay-ar4fah
date: 2026/06/1
tags:
    - attack.defense_evasion
    - attack.t1036.005
    - attack.t1014
logsource:
    category: process_creation
    product: windows
detection:
    selection_hashes:
        Hashes|contains:
            - 'SHA256=6c8930b5d3168902e080afe5fad0adaeb89975f706ba08e738d1ee1fbae06e8f'
            - 'SHA256=a04ee025d13c0be594ecc7d52bbb586b3003205091fd8234e7462431ee857615'
            - 'MD5=57b0ca1debf04843030fcb3f2112ef8a'
            - 'MD5=234bd61b23b5b785af9ecd2a6412e2d3'

    selection_svchost_masq:
        Image|endswith: '\svchost.exe'
    filter_svchost_legit:
        Image|startswith:
            - 'C:\Windows\System32\'
            - 'C:\Windows\SysWOW64\'

    selection_suspicious_names:
        Image|endswith:
            - '\DiscordFix.exe'
            - '\ZeninDLC.exe'
            - '\khgsmd.exe'
            - '\movchvq.exe'
    selection_suspicious_campaign:
        Image|contains:
            - 'r77-SheetRat'
            - 'Plc.rootkit.r77'

    condition: selection_hashes or (selection_svchost_masq and not filter_svchost_legit) or selection_suspicious_names or selection_suspicious_campaign
falsepositives:
    - Eksekusi svchost di luar folder sistem hampir 99% dapat dipastikan sebagai aktivitas berbahaya (Malware/Adware).
    - Hash dan nama file kampanye spesifik tidak memiliki false positive (sangat akurat).
level: high
