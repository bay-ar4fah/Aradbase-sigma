title: Behavior Dropper - Agent Tesla AutoIt Payload Drop & Persistence
id: 33333333-4444-406a-9f5b-1d7e2f5b8a9c
status: stable
description: Detects Dropper behavior dropping executable payloads and creating VBS startup scripts for persistence.
author: bay-ar4fah
date: 2026/06/3
tags:
    - attack.persistence
    - attack.t1547.001
logsource:
    category: file_event
    product: windows
detection:
    selection_startup:
        TargetFilename|endswith: '\Microsoft\Windows\Start Menu\Programs\Startup\Idonna.vbs'
    selection_payload:
        TargetFilename|endswith:
            - '\AppData\Local\preinhered\Idonna.exe'
            - '\AppData\Local\preinhered\RaVQVB.exe'
    
    condition: selection_startup or selection_payload
falsepositives:
    - Tidak ada.
level: critical
